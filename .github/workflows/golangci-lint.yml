name: golangci-lint
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - name: golangci-lint geth_compatibility
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: scripts/geth_compatibility